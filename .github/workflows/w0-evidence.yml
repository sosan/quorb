name: W0 evidence — Windows/WSL discovery

# Evidence-only lab for Quorb issue #90 (W0 observe phase).
# Run on a hosted Windows runner; collects real wsl.exe behavior.
# Collects no credentials and contains no Quorb code.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl-w0:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Host inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path raw | Out-Null
          Get-ComputerInfo -Property OsName, OsVersion, OsArchitecture |
            Out-String | Set-Content raw/host-info.txt
          "Image label: $env:ImageOS / $env:ImageVersion" | Set-Content raw/host-image.txt

            exit 0

      - name: WSL baseline — default encoding (raw bytes preserved)
        shell: pwsh
        run: |
          & cmd /c "wsl.exe --status > raw\status-default.txt 2>&1"
          "EXIT=$LASTEXITCODE" | Add-Content raw/status-default.txt
          & cmd /c "wsl.exe --version > raw\version-default.txt 2>&1"
          "EXIT=$LASTEXITCODE" | Add-Content raw/version-default.txt
          & cmd /c "wsl.exe --list --verbose > raw\list-verbose-default.txt 2>&1"
          "EXIT=$LASTEXITCODE" | Add-Content raw/list-verbose-default.txt
          & cmd /c "wsl.exe --list --online > raw\list-online-default.txt 2>&1"
          "EXIT=$LASTEXITCODE" | Add-Content raw/list-online-default.txt
          $bytes = [IO.File]::ReadAllBytes("raw/list-verbose-default.txt")
          $head = ($bytes[0..63] | ForEach-Object { $_.ToString('X2') }) -join ' '
          # BOM UTF-16LE = FF FE; UTF-16LE sin BOM = byte par 0x00 en offset impar
          # (p.ej. offset 1 para un ASCII 'M'=0x4D, que da 0x00 0x4D en LE).
          # Se agrupa cada comprobacion entre parentesis para que -or no se confunda.
          $hasBom  = ($bytes.Length -ge 2 -and $bytes[0] -eq 0xFF -and $bytes[1] -eq 0xFE)
          $noBomLE = ($bytes.Length -ge 3 -and $bytes[1] -eq 0x00 -and $bytes[2] -eq 0x2D)
          $leShape = ($bytes.Length -ge 4 -and $bytes[3] -eq 0x00)
          $bom16 = ($hasBom -or $noBomLE -or $leShape)
          "Head bytes: $head" | Set-Content raw/hex-head-list-verbose.txt
          "Likely UTF-16LE payload: $bom16" | Set-Content raw/encoding-shape.txt

            exit 0

      - name: WSL baseline — WSL_UTF8=1
        shell: pwsh
        env:
          WSL_UTF8: '1'
        run: |
          cmd /c "wsl.exe --status > raw\status-wslutf8.txt 2>&1"
          cmd /c "wsl.exe --list --verbose > raw\list-verbose-wslutf8.txt 2>&1"
          cmd /c "wsl.exe --list --all > raw\list-all-wslutf8.txt 2>&1"
          cmd /c "wsl.exe --help > raw\help-wslutf8.txt 2>&1"
          Get-Content raw/status-wslutf8.txt
          Get-Content raw/list-verbose-wslutf8.txt

            exit 0

      - name: Zero-distro state — unregister everything, capture diagnostics
        shell: pwsh
        run: |
          cmd /c "wsl.exe --list --quiet > raw\pre-zero-quiet-raw.txt 2>&1"
          function Get-WslText([string]$path) {
            $b = [IO.File]::ReadAllBytes($path)
            if ($b.Length -ge 2 -and $b[0] -eq 0xFF -and $b[1] -eq 0xFE) {
              return [Text.Encoding]::Unicode.GetString($b, 2, $b.Length - 2)
            }
            $utf8 = [Text.Encoding]::UTF8.GetString($b)
            if ($utf8.Contains([char]0)) {
              $utf8 = [Text.Encoding]::Unicode.GetString($b)
            }
            return $utf8.Trim([char]0, " ", "`r", "`n", "`t")
          }
          $names = (Get-WslText "raw/pre-zero-quiet-raw.txt") -split "`r?`n" |
            Where-Object { $_.Trim() }
          "Names found (decoded): $($names -join ' | ')" |
            Set-Content raw/zero-step-found.txt
          foreach ($d in $names) {
            & wsl.exe --unregister $d.Trim() *> raw/unregister-log.txt -Append
          }
          ">> --status with zero distros" | Add-Content raw/zero-distro-status.txt
          & wsl.exe --status *>> raw/zero-distro-status.txt
          ">> -l -v with zero distros" | Add-Content raw/zero-distro-list.txt
          & wsl.exe --list --verbose *>> raw/zero-distro-list.txt
          ">> exit code of running a missing distro" | Add-Content raw/zero-distro-missing.txt
          & wsl.exe -d Ubuntu -- echo probe *>> raw/zero-distro-missing.txt
          "LASTEXITCODE=$LASTEXITCODE" | Add-Content raw/zero-distro-missing.txt
          Get-WslText "raw/zero-distro-list.txt" | Set-Content raw/zero-distro-list-decoded.txt

            exit 0

      - name: Prepare pinned Alpine rootfs (sha256-verified)
        shell: pwsh
        run: |
          $url = "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.3-x86_64.tar.gz"
          $expected = "d4e6fd67dcf75e40c451560ac7265166c2b72a0f38ddc9aae756a7de3d1efa0c"
          Invoke-WebRequest -Uri $url -OutFile rootfs.tar.gz
          $hash = (Get-FileHash rootfs.tar.gz -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash expected=$expected" | Set-Content raw/rootfs-hash.txt
          if ($hash -ne $expected) {
            "HASH MISMATCH — aborting" | Add-Content raw/rootfs-hash.txt
            exit 1
          }

            exit 0

      - name: Import two distros — plain name and spaced/unicode name
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\wsl\q1, C:\wsl\q2 | Out-Null
          & wsl.exe --import quorb_w0 C:\wsl\q1 rootfs.tar.gz *>&1 |
            Set-Content raw/import-plain.txt
          & wsl.exe --import "Quorb Prueba Ñ" C:\wsl\q2 rootfs.tar.gz *>&1 |
            Set-Content raw/import-unicode.txt
          $env:WSL_UTF8 = '1'
          ">> -l -v after imports" | Add-Content raw/list-after-import.txt
          & wsl.exe --list --verbose *>> raw/list-after-import.txt

            exit 0

      - name: Listing does not wake a stopped distro (timing evidence)
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          & wsl.exe --terminate quorb_w0 *>&1 | Set-Content raw/terminate-first.txt
          Start-Sleep -Seconds 2
          ">> state after terminate" | Add-Content raw/stopped-list.txt
          & wsl.exe --list --verbose *>> raw/stopped-list.txt
          ">> run 20x --list --quiet then re-check state" | Add-Content raw/list-does-not-wake.txt
          1..20 | ForEach-Object { & wsl.exe --list --quiet | Out-Null }
          Start-Sleep -Seconds 2
          & wsl.exe --list --verbose *>> raw/list-does-not-wake.txt

            exit 0

      - name: A command wakes the distro; Running vs Stopped
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          ">> running command in quorb_w0" | Add-Content raw/wake-and-run.txt
          & wsl.exe -d quorb_w0 -- uname -a *>> raw/wake-and-run.txt
          ">> state right after command" | Add-Content raw/running-list.txt
          & wsl.exe --list --verbose *>> raw/running-list.txt
          ">> terminate then re-check" | Add-Content raw/terminated-list.txt
          & wsl.exe --terminate quorb_w0 *>> raw/terminated-list.txt
          & wsl.exe --list --verbose *>> raw/terminated-list.txt

            exit 0

      - name: Default user and home (no name assumptions)
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          ">> whoami before /etc/wsl.conf (import default = root)" |
            Add-Content raw/user-default.txt
          & wsl.exe -d quorb_w0 -- whoami *>> raw/user-default.txt
          ">> create non-root user" | Add-Content raw/user-default.txt
          & wsl.exe -d quorb_w0 -- sh -c "adduser -D quorbuser 2>&1" *>> raw/user-default.txt
          ">> write /etc/wsl.conf [user] default=quorbuser" | Add-Content raw/user-default.txt
          & wsl.exe -d quorb_w0 -- sh -c "printf '[user]\ndefault=quorbuser\n' > /etc/wsl.conf && cat /etc/wsl.conf" *>> raw/user-default.txt
          ">> terminate to apply new default user" | Add-Content raw/user-default.txt
          & wsl.exe --terminate quorb_w0 *>> raw/user-default.txt
          Start-Sleep -Seconds 2
          ">> whoami after conf" | Add-Content raw/user-default.txt
          & wsl.exe -d quorb_w0 -- whoami *>> raw/user-default.txt
          ">> home resolution (no assumption from Windows username)" | Add-Content raw/user-default.txt
          & wsl.exe -d quorb_w0 -- sh -c 'echo "HOME=$HOME"; getent passwd quorbuser; echo "pwd=$(pwd)"' *>> raw/user-default.txt
          ">> Windows-side username for contrast (runneradmin expected)" |
            Add-Content raw/user-default.txt
          whoami >> raw/user-default.txt
          ">> -u root override still works" | Add-Content raw/user-default.txt
          & wsl.exe -d quorb_w0 -u root -- whoami *>> raw/user-default.txt

            exit 0

      - name: Unicode and spaced distro name targeting
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          ">> run command in distro with spaced/unicode name" |
            Add-Content raw/unicode-name.txt
          & wsl.exe -d "Quorb Prueba Ñ" -- sh -c "echo target-ok" *>> raw/unicode-name.txt
          ">> confirm it is the second independent rootfs" | Add-Content raw/unicode-name.txt
          & wsl.exe -d "Quorb Prueba Ñ" -- sh -c 'cat /etc/alpine-release; echo $$' *>> raw/unicode-name.txt
          ">> full -l -v shows the unicode name?" | Add-Content raw/unicode-name.txt
          & wsl.exe --list --verbose *>> raw/unicode-name.txt
          ">> setting default distro to the unicode name then unsetting" | Add-Content raw/unicode-name.txt
          & wsl.exe --set-default "Quorb Prueba Ñ" *>> raw/unicode-name.txt
          & wsl.exe --set-default quorb_w0 *>> raw/unicode-name.txt

            exit 0

      - name: Exit codes — missing distro, invalid flags
        shell: pwsh
        run: |
          ">> wsl -d nonexistent-distro" | Add-Content raw/exit-codes.txt
          & wsl.exe -d nonexistent-distro -- echo hi *>> raw/exit-codes.txt
          "LASTEXITCODE=$LASTEXITCODE" | Add-Content raw/exit-codes.txt
          ">> wsl --definitely-not-a-flag" | Add-Content raw/exit-codes.txt
          & wsl.exe --definitely-not-a-flag *>> raw/exit-codes.txt
          "LASTEXITCODE=$LASTEXITCODE" | Add-Content raw/exit-codes.txt
          ">> wsl --list --all (valid)" | Add-Content raw/exit-codes.txt
          & wsl.exe --list --all *>> raw/exit-codes.txt
          "LASTEXITCODE=$LASTEXITCODE" | Add-Content raw/exit-codes.txt
          ">> empty distro name" | Add-Content raw/exit-codes.txt
          & wsl.exe -d " " -- echo hi *>> raw/exit-codes.txt
          "LASTEXITCODE=$LASTEXITCODE" | Add-Content raw/exit-codes.txt

            exit 0

      - name: Timeout / hang behavior evidence
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          ">> launch sleeping wsl command in background (does NOT wait)" |
            Add-Content raw/timeout-hang.txt
          $p = Start-Process -FilePath wsl.exe -ArgumentList @(
              '-d', 'quorb_w0', '--', 'sleep', '60'
            ) -PassThru -NoNewWindow -RedirectStandardOutput raw/timeout-stdout.txt -RedirectStandardError raw/timeout-stderr.txt
          Start-Sleep -Seconds 3
          "Launcher alive after 3s: $(-not ($p.HasExited))" | Add-Content raw/timeout-hang.txt
          ">> distro should be Running while the sleep lives" | Add-Content raw/timeout-hang.txt
          & wsl.exe --list --verbose *>> raw/timeout-hang.txt
          ">> kill only the launcher" | Add-Content raw/timeout-hang.txt
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          ">> state after launcher kill (child may still live)" | Add-Content raw/timeout-hang.txt
          & wsl.exe --list --verbose *>> raw/timeout-hang.txt
          ">> explicit terminate" | Add-Content raw/timeout-hang.txt
          & wsl.exe --terminate quorb_w0 *>> raw/timeout-hang.txt
          Start-Sleep -Seconds 2
          ">> state after terminate (expect Stopped)" | Add-Content raw/timeout-hang.txt
          & wsl.exe --list --verbose *>> raw/timeout-hang.txt

            exit 0

      # F7 — Acceso UNC sin despertar la distro (home vía \\wsl.localhost\$)
      - name: UNC access to home without waking the distro
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          & wsl.exe --terminate quorb_w0 *>$null
          Start-Sleep -Seconds 2
          # Use Add-Content -Value (appends; never uses the `>>` redirection operator,
          # so parens/backticks in the text cannot be parsed as commands).
          $log = 'raw/unc-wake.txt'
          Add-Content $log -Value ">> state after terminate"
          & wsl.exe --list --verbose *>> $log
          Add-Content $log -Value ">> Test-Path \\wsl.localhost\quorb_w0\home\quorbuser (distro Stopped)"
          $t1 = Test-Path "\\wsl.localhost\quorb_w0\home\quorbuser"
          Add-Content $log -Value "Test-Path result: $t1"
          Add-Content $log -Value ">> state right after Test-Path"
          & wsl.exe --list --verbose *>> $log
          Add-Content $log -Value ">> Get-ChildItem \\wsl.localhost\quorb_w0\home\quorbuser (distro Stopped)"
          try {
            $items = @(Get-ChildItem "\\wsl.localhost\quorb_w0\home\quorbuser" -ErrorAction Stop)
            Add-Content $log -Value "Get-ChildItem count: $($items.Count)"
          } catch {
            Add-Content $log -Value "Get-ChildItem error: $($_.Exception.Message)"
          }
          Add-Content $log -Value ">> state right after Get-ChildItem"
          & wsl.exe --list --verbose *>> $log
          Add-Content $log -Value ">> CONTROL: wsl -d quorb_w0 -- whoami (must wake)"
          & wsl.exe -d quorb_w0 -- whoami *>> $log
          Add-Content $log -Value ">> state after control whoami"
          & wsl.exe --list --verbose *>> $log

            exit 0

      # F8 — Semántica de shell para detección y login (decisión W1)
      - name: Shell semantics for detection and login
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          & wsl.exe -d quorb_w0 -- true  # ensure Running
          # Use Add-Content -Value (appends; never uses the `>>` redirection
          # operator, so parens/backticks/quotes in the text cannot be parsed as
          # commands). Set-Content -Value would replace the file on each call.
          $log = 'raw/shell-semantics.txt'
          Add-Content $log -Value ">> plain ``wsl -d X -- <cmd>`` (sh -c form)"
          & wsl.exe -d quorb_w0 -- sh -c 'echo SHELL=$SHELL; echo 0=$$; which sh; echo PATH=$PATH' *>> $log
          Add-Content $log -Value ">> explicit ``-e sh -c``"
          & wsl.exe -d quorb_w0 -e sh -c 'echo SHELL=$SHELL; echo 0=$$' *>> $log
          Add-Content $log -Value ">> whoami (default user per /etc/wsl.conf)"
          & wsl.exe -d quorb_w0 -- whoami *>> $log
          Add-Content $log -Value ">> ``bash -lc`` (login shell) PATH"
          & wsl.exe -d quorb_w0 -- bash -lc 'echo BASH=$BASH; echo PATH=$PATH' *>> $log
          Add-Content $log -Value ">> ``bash -c`` (non-login) PATH"
          & wsl.exe -d quorb_w0 -- bash -c 'echo BASH=$BASH; echo PATH=$PATH' *>> $log
          Add-Content $log -Value ">> /bin/sh -lc PATH"
          & wsl.exe -d quorb_w0 -- /bin/sh -lc 'echo PATH=$PATH' *>> $log
          Add-Content $log -Value ">> PATH de la distro por defecto (no login)"
          & wsl.exe -d quorb_w0 -- 'echo $PATH' *>> $log

            exit 0

      # F9/F10 — Path de wsl.exe en el runner + stdin no-TTY
      - name: wsl.exe location and non-TTY stdin behavior
        shell: pwsh
        run: |
          # Use Add-Content -Value (appends; never uses the `>>` redirection
          # operator, so parens/quotes/backticks in the text cannot be parsed as
          # commands). Set-Content -Value would replace the file on each call.
          $pathLog = 'raw/wsl-path.txt'
          Add-Content $pathLog -Value ">> (Get-Command wsl.exe).Source on hosted windows-latest"
          (Get-Command wsl.exe).Source | Tee-Object -FilePath $pathLog -Append
          Add-Content 'raw/wsl-version.txt' -Value ">> wsl.exe --version"
          & wsl.exe --version *>> 'raw/wsl-version.txt'
          $stdinLog = 'raw/stdin-tty.txt'
          Add-Content $stdinLog -Value ">> F10: stdin non-TTY — same cmd via pwsh and cmd /c"
          Add-Content $stdinLog -Value "via pwsh (redir stdio):"
          & wsl.exe -d quorb_w0 -- whoami *>> $stdinLog
          Add-Content $stdinLog -Value "via cmd /c (redir stdio):"
          & cmd /c "wsl.exe -d quorb_w0 -- whoami" *>> $stdinLog
          Add-Content $stdinLog -Value ">> F10: stdin-echo test (read from stdin and echo)"
          Add-Content $stdinLog -Value "echo via pwsh pipe:"
          "hi-from-pwsh" | & wsl.exe -d quorb_w0 -- sh -c 'read x; echo got=[$x]' *>> $stdinLog
          Add-Content $stdinLog -Value "echo via cmd pipe:"
          cmd /c "echo hi-from-cmd | wsl.exe -d quorb_w0 -- sh -c ""read x; echo got=[$x]""" *>> $stdinLog
          & wsl.exe --terminate quorb_w0 *>$null

            exit 0

      # F11 — wsl --cd <path>: ¿el comando arranca en el home de la distro o en el cwd de Windows?
      # (Decisión W2-PLAN §4: si --cd existe y funciona, el login no necesita 'cd ~' manual.)
      # NOTA: no usar backticks dentro de Add-Content -Value "...": en pwsh el backtick
      # es el caracter de escape y rompe el string (ParserError). Se escribe el comando
      # con corchetes [..] en lugar de `..`.
      - name: F11 — wsl --cd path support (cwd in distro)
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          $log = 'raw/f11-cd.txt'
          & wsl.exe -d quorb_w0 -- true  # ensure Running
          Add-Content $log -Value '>> plain [wsl -d X -- pwd] (cwd de Windows esperado)'
          & wsl.exe -d quorb_w0 -- pwd *>> $log
          Add-Content $log -Value '>> [wsl -d X --cd ~ -- pwd] (si soporta --cd)'
          & wsl.exe -d quorb_w0 --cd ~ -- pwd *>> $log
          Add-Content $log -Value ">> exit code of --cd attempt: $LASTEXITCODE"
          Add-Content $log -Value ">> control: [wsl -d X -- bash -lc 'cd ~ && pwd']"
          & wsl.exe -d quorb_w0 -- bash -lc 'cd ~ && pwd' *>> $log 2>&1
          & wsl.exe --terminate quorb_w0 *>$null

            exit 0

      # F12 — Estrategia de shell CON bash: se instala bash en la Alpine importada
      #       (apk add bash) y se prueban -e bash -lc vs fallback -e sh -c en la MISMA
      #       distro. Cierra el gap F12 del run 39509129152 (antes: SKIP, sin bash).
      # NOTA (hallazgo run 39512692244): el default user de /etc/wsl.conf
      #       (quorbuser, no-root) NO puede escribir en /var/lib/apk: un apk add
      #       sin root falla con "Unable to lock database: Permission denied"
      #       (exit 99). Se instala con -u root, pero las pruebas de la estrategia
      #       de shell se hacen como default user (el que la app usaria).
      - name: F12 — Shell strategy with bash installed on Alpine (real)
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          $log = 'raw/f12-bash-distro.txt'
          Add-Content $log -Value ">> estado inicial (-l -v)"
          & wsl.exe --list --verbose *>> $log
          Add-Content $log -Value ">> instalar bash como root (-u root apk add bash)"
          & wsl.exe -d quorb_w0 -u root -- sh -c 'apk add --no-cache bash' *>> $log
          Add-Content $log -Value ">> exit code de apk add bash: $LASTEXITCODE"
          Add-Content $log -Value ">> command -v bash como default user (quorbuser)"
          & wsl.exe -d quorb_w0 -- sh -c 'command -v bash' *>> $log
          Add-Content $log -Value ">> -e bash -lc (login shell) — PATH y BASH"
          & wsl.exe -d quorb_w0 -e bash -lc 'echo BASH=$BASH; echo PATH=$PATH' *>> $log
          Add-Content $log -Value ">> -e bash -c (non-login) — PATH"
          & wsl.exe -d quorb_w0 -e bash -c 'echo BASH=$BASH; echo PATH=$PATH' *>> $log
          Add-Content $log -Value ">> control -e sh -c (fallback) — SHELL"
          & wsl.exe -d quorb_w0 -e sh -c 'echo SHELL=$SHELL; echo PATH=$PATH' *>> $log
          Add-Content $log -Value ">> home con bash -lc (cd ~ && pwd)"
          & wsl.exe -d quorb_w0 -e bash -lc 'cd ~ && pwd' *>> $log
          Add-Content $log -Value ">> PATH de la distro por defecto (sin login) para contraste"
          & wsl.exe -d quorb_w0 -- 'echo $PATH' *>> $log
          & wsl.exe --terminate quorb_w0 *>$null

            exit 0

      # F13 — Timeout real del launcher: kill del launcher NO detiene la distro (F4),
      #        y --terminate SÍ. Verificación de estado explícita post-kill y post-terminate.
      - name: F13 — Launcher kill vs terminate (state verification)
        shell: pwsh
        run: |
          $env:WSL_UTF8 = '1'
          $log = 'raw/f13-launcher-vs-terminate.txt'
          & wsl.exe -d quorb_w0 -- true  # ensure Running
          Add-Content $log -Value ">> estado inicial (Running esperado)"
          & wsl.exe --list --verbose *>> $log
          Add-Content $log -Value ">> lanzar 'sleep 60' en background"
          $p = Start-Process -FilePath wsl.exe -ArgumentList @(
              '-d', 'quorb_w0', '--', 'sleep', '60'
            ) -PassThru -NoNewWindow -RedirectStandardOutput raw/f13-stdout.txt -RedirectStandardError raw/f13-stderr.txt
          Start-Sleep -Seconds 3
          Add-Content $log -Value ">> launcher alive after 3s: $(-not ($p.HasExited))"
          Add-Content $log -Value ">> kill SOLO el launcher (PID $($p.Id))"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Add-Content $log -Value ">> estado tras kill del launcher (F4: distro sigue Running)"
          & wsl.exe --list --verbose *>> $log
          Add-Content $log -Value ">> --terminate quorb_w0 (debe dejar Stopped)"
          & wsl.exe --terminate quorb_w0 *>> $log
          Start-Sleep -Seconds 2
          Add-Content $log -Value ">> estado tras --terminate (Stopped esperado)"
          & wsl.exe --list --verbose *>> $log

            exit 0

      - name: Evidence summary and artifact matrix
        shell: pwsh
        run: |
          $lines = Get-ChildItem raw -File | Sort-Object Name | ForEach-Object {
            "| $($_.Name) | $($_.Length) |"
          }
          $head = [System.Collections.Generic.List[string]]::new()
          $head.Add("## W0 evidence — Windows/WSL discovery (windows-latest)")
          $head.Add("")
          $head.Add("| File | Size |")
          $head.Add("| --- | --- |")
          $head.AddRange([string[]]$lines)
          $head.Add("")
          $head.Add("Nuances to inspect for the W1 decision:")
          $head.Add("1. Encoding of wsl.exe --list / --status output without WSL_UTF8 (UTF-16LE BOM or not) — see hex-head-list-verbose.txt")
          $head.Add("2. Exit codes: missing distro vs invalid flags vs empty name")
          $head.Add("3. State transitions after import, wake, terminate, hang-kill (list-after-import, running-list, terminated-list, timeout-hang)")
          $head.Add("4. Plain --list --quiet x20 does not wake a stopped distro? — list-does-not-wake.txt")
          $head.Add("5. Default user / home before and after /etc/wsl.conf [user] — user-default.txt")
          $head.Add("6. Zero-distro diagnostics — zero-distro-*.txt")
          $head.Add("7. Spaced / unicode distro name behavior — unicode-name.txt, import-unicode.txt")
          $head.Add("8. F11 wsl --cd path support — f11-cd.txt (arranca el comando en home o en cwd Windows?)")
          $head.Add("9. F12 shell strategy with bash installed on Alpine — f12-bash-distro.txt (-e bash -lc vs -e sh -c con bash real)")
          $head.Add("10. F13 launcher kill vs terminate — f13-launcher-vs-terminate.txt (F4 ampliado con estado post-kill y post-terminate)")
          $summary = $head -join "`n"
          Set-Content EVIDENCE.md $summary
          Add-Content $env:GITHUB_STEP_SUMMARY $summary

            exit 0

