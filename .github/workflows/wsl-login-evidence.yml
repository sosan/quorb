# WSL login evidence — evidencia REAL en Windows + WSL (issue #92, AC9)
#
# Laboratorio de evidencia, estilo W3, que se ejecuta en un runner Windows
# real con WSL2 (windows-latest trae la distro Ubuntu por defecto). Casos que
# no se pueden simular en Linux ni en unit tests:
#   GAP1  detección de una CLI presente SOLO dentro de la distro
#         (`command -v` a través de wsl.exe, sin la CLI en Windows);
#   GAP2  el comando de login se ejecuta DENTRO de la distro y escribe allí
#         (marker plantado en el guest);
#   GAP3  la lectura de sesión lee la ruta EXACTA que la resolución espera
#         (`<home>/.quorb/accounts/<provider>-<suffix>`) dentro de la distro.
#
# Los tests #[ignore = "requiere WSL real"] viven en login.rs (rama de
# evidencia) y se ejecutan con `--ignored`. Ningún paso toca credenciales
# reales: los shims y los ficheros de sesión son de prueba y se borran.

name: WSL login evidence (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref (rama, tag o SHA) a testear'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  wsl-login-evidence:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.3
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      # Distro REAL importada desde un rootfs Alpine fijado (patrón W0,
      # sha256 verificado): windows-latest no trae distro preinstalada.
      - name: Prepare pinned Alpine rootfs (sha256-verified)
        shell: pwsh
        run: |
          $url = "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.3-x86_64.tar.gz"
          $expected = "d4e6fd67dcf75e40c451560ac7265166c2b72a0f38ddc9aae756a7de3d1efa0c"
          Invoke-WebRequest -Uri $url -OutFile rootfs.tar.gz
          $hash = (Get-FileHash rootfs.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $expected) { throw "HASH MISMATCH: $hash" }
          Write-Host "rootfs OK ($hash)"

      # Import con el patrón EXACTO del lab W0 (pwsh + wsl.exe --import):
      # desde bash, el import devuelve Wsl/ERROR_PATH_NOT_FOUND.
      - name: Import the evidence distro
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\wsl | Out-Null
          & wsl.exe --import quorb_e92 C:\wsl\e92 rootfs.tar.gz *>&1 |
            Tee-Object -FilePath import.txt
          if ($LASTEXITCODE -ne 0) { Get-Content import.txt; exit 1 }
          & wsl.exe -d quorb_e92 -- true
          & wsl.exe --list --verbose

      # Shims y fichero de sesión DENTRO de la distro. El script se pasa por
      # stdin (`sh -s`): sin quoting de rutas del host.
      - name: Plant CLI shims and session file inside the distro
        shell: pwsh
        run: |
          @'
          set -euo pipefail
          mkdir -p /usr/local/bin
          cat > /usr/local/bin/codex <<'SHIM'
          #!/bin/sh
          printf 'codex-shim\n' > /tmp/quorb-evidence-login
          exit 0
          SHIM
          cat > /usr/local/bin/claude <<'SHIM'
          #!/bin/sh
          printf 'claude-shim\n'
          exit 0
          SHIM
          chmod 755 /usr/local/bin/codex /usr/local/bin/claude
          command -v codex
          command -v claude
          mkdir -p /root/.quorb/accounts/claude-w1
          printf '{"claudeAiOauth":{"accessToken":"v-evidencia-92"}}' > /root/.quorb/accounts/claude-w1/.credentials.json
          ls -la /root/.quorb/accounts/claude-w1/
          '@ | Set-Content -Encoding utf8NoBOM setup.sh
          Get-Content setup.sh -Raw | wsl.exe -d quorb_e92 -- sh -s

      # Los tests #[ignore] de evidencia usan la distro real (RealWslAdapter)
      # y la variable de entorno de esta sesión.
      - name: Run WSL login evidence tests (ignored)
        shell: bash
        env:
          QUORB_WSL_EVIDENCE_DISTRO: quorb_e92
        run: |
          set -euo pipefail
          cd src-tauri
          cargo test --locked login::wsl_evidence:: -- --ignored --nocapture

      - name: Verdict
        shell: bash
        run: |
          set -euo pipefail
          echo "GAP1/GAP2/GAP3: PASS si el run termina sin fallos (ver salida de los tests)."
