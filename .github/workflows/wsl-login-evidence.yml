# WSL login evidence — evidencia REAL en Windows + WSL (issue #92, AC9)
#
# Lab de evidencia (rama propia del fork, no entra en la PR). Runner Windows
# real + WSL2 con una distro Ubuntu importada desde el rootfs oficial:
#   GAP1  detección de una CLI presente SOLO dentro de la distro
#         (`command -v` por wsl.exe, sin la CLI en Windows);
#   GAP2  el comando de login corre DENTRO del guest y escribe allí (marker);
#   GAP3  la sesión se lee en la ruta EXACTA que la resolución espera
#         (`<home>/.quorb/accounts/<provider>-<suffix>`).
#
# Los tests #[ignore] viven en login.rs y se ejecutan con `--ignored`.
# Ningún paso toca credenciales reales. Los scripts del guest se escriben con
# finales de línea LF: con CRLF, `/bin/sh` recibe `-eu\r` y aborta.

name: WSL login evidence (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref (rama, tag o SHA) a testear'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  wsl-login-evidence:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Distro Ubuntu REAL importada desde el rootfs oficial (no Alpine).
      # El nombre exacto del tarball se toma de SHA256SUMS (no se fija a mano):
      # si aparece un punto de release nuevo, el lab sigue funcionando.
      - name: Download ubuntu-base rootfs + official checksums
        shell: pwsh
        run: |
          $base = "https://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release"
          Invoke-WebRequest -Uri "$base/SHA256SUMS" -OutFile SHA256SUMS
          $line = Get-Content SHA256SUMS |
            Where-Object { $_ -match "\*?ubuntu-base-22\.04\.\d+-base-amd64\.tar\.gz$" } |
            Sort-Object -Property { ($_ -split "\s+")[1] } -Descending |
            Select-Object -First 1
          if (-not $line) { throw "SHA256SUMS sin entrada ubuntu-base 22.04 amd64" }
          $parts = $line -split "\s+"
          $expected = $parts[0]
          $file = $parts[1].TrimStart("*")
          Invoke-WebRequest -Uri "$base/$file" -OutFile ubuntu-base.tar.gz
          $actual = (Get-FileHash ubuntu-base.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "HASH MISMATCH: $actual != $expected" }
          Write-Host "rootfs OK ($file, $actual)"

      - name: Import the Ubuntu evidence distro
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\wsl | Out-Null
          & wsl.exe --import quorb-e92 C:\wsl\e92 ubuntu-base.tar.gz
          & wsl.exe -d quorb-e92 -- bash -lc "id && echo listo"

      # Script del guest escrito con LF y ejecutado por la ruta montada
      # (/mnt/<unidad>/...): evita el CRLF de PowerShell y el stdin.
      - name: Plant CLI shims and session file inside the distro
        shell: pwsh
        run: |
          $script = @'
          set -euo pipefail
          mkdir -p /usr/local/bin
          cat > /usr/local/bin/codex <<'SHIM'
          #!/bin/sh
          printf 'codex-shim\n' > /tmp/quorb-evidence-login
          exit 0
          SHIM
          cat > /usr/local/bin/claude <<'SHIM'
          #!/bin/sh
          printf 'claude-shim\n'
          exit 0
          SHIM
          chmod 755 /usr/local/bin/codex /usr/local/bin/claude
          command -v codex
          command -v claude
          mkdir -p /root/.quorb/accounts/claude-w1
          printf '{"claudeAiOauth":{"accessToken":"v-evidencia-92"}}' > /root/.quorb/accounts/claude-w1/.credentials.json
          ls -la /root/.quorb/accounts/claude-w1/
          '@
          $lf = $script -replace "`r`n", "`n"
          [IO.File]::WriteAllText("$PWD/setup.sh", $lf, (New-Object Text.UTF8Encoding($false)))
          # `/mnt/d`, no `/mnt/D`: el punto de montaje de WSL es la unidad en
          # minúscula y Linux distingue mayúsculas.
          $ws = "$env:GITHUB_WORKSPACE".Replace("\", "/").ToLower()
          $guest = $ws -replace "^([a-z]):", "/mnt/`$1"
          wsl.exe -d quorb-e92 -- bash "$guest/setup.sh"

      # La compilación tarda minutos y WSL detiene la distro ociosa: si se
      # llega a los tests con la distro Stopped, `cli_check` responde Stopped
      # (por diseño no la despierta) y GAP1 fallaría. Se compila ANTES y se
      # mantiene la distro viva durante los tests con un proceso dormido.
      - name: Build the test binary (distro not needed yet)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo test --locked --no-run

      - name: Keep the distro running during the tests
        shell: pwsh
        run: |
          # WSL_UTF8=1 (F1): sin él, wsl.exe escribe UTF-16LE y PowerShell 7
          # decodifica basura; con él la lista es UTF-8 y «Running» es legible.
          $env:WSL_UTF8 = "1"
          Start-Process -FilePath wsl.exe -ArgumentList '-d','quorb-e92','--','sleep','900'
          Start-Sleep -Seconds 3
          & wsl.exe --list --verbose
          if (-not ((& wsl.exe --list --verbose) -match 'Running')) { throw "la distro no está Running" }

      - name: Run WSL login evidence tests (ignored)
        shell: bash
        env:
          QUORB_WSL_EVIDENCE_DISTRO: quorb-e92
        run: |
          set -euo pipefail
          cd src-tauri
          cargo test --locked login::wsl_evidence:: -- --ignored --nocapture

      # Binario de PRODUCCIÓN (no el harness de tests): valida que el
      # ejecutable que se entrega compila y enlaza con el código de #92.
      # `dist/` está en el repo, así que `tauri::generate_context!` resuelve
      # `frontendDist`.
      - name: Build the real app binary
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo build --locked
          ls -l target/debug/quorb.exe

      # Arranque/parada del .exe: comprueba que el binario real no crashea al
      # iniciar (plugins, tray, WebView2). Sin sesión de escritorio esto no
      # valida la GUI: solo que el proceso vive y se cierra limpiamente.
      - name: Launch smoke of the real binary
        shell: pwsh
        run: |
          $exe = "src-tauri\target\debug\quorb.exe"
          if (-not (Test-Path $exe)) { throw "no se generó quorb.exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            throw "quorb.exe terminó al arrancar (exit $($p.ExitCode))"
          }
          if (-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) {
            throw "quorb.exe ya no está vivo"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "arranque OK (pid $($p.Id)); proceso detenido"

      - name: Verdict
        shell: bash
        run: |
          set -euo pipefail
          echo "GAP1/GAP2/GAP3: PASS si el run termina sin fallos (ver salida de los tests)."
          echo "Binario real: build + arranque/parada OK si los pasos anteriores pasan."
